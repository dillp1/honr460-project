<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Blog</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1.05rem/1.6 system-ui, sans-serif; }
    img { max-width: 100%; }
    pre { overflow-x: auto; }
  </style>
</head>
<body>
  <main id="post">Loading…</main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch("post.md")
      .then((r) => r.text())
      .then((md) => { document.getElementById("post").innerHTML = marked.parse(md); });
  </script>
</body>
</html>
